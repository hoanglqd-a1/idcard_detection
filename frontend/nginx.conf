server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    # Multipart bodies are bounded; temporary upload files are removed by Nginx.
    client_body_buffer_size 11m;
    error_page 413 = @upload_too_large;

    location @upload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"error":{"code":"file_too_large","message":"The uploaded request exceeds the size limit."}}';
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
